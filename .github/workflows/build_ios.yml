name: Build iOS Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_ios:
    name: Compilar iOS (macOS Runner)
    runs-on: macos-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar iOS Release (sin firma)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar IPA para pruebas y distribución
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Basta_iOS.ipa Payload
          cd ../../..

      - name: Subir artefacto IPA compilado
        uses: actions/upload-artifact@v4
        with:
          name: Basta_iOS_Release
          path: build/ios/iphoneos/Basta_iOS.ipa
          retention-days: 14
